<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
  </head>
  <style>
    #startButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      font-size: 20px;
      font-weight: bold;
      color: red;
    }
    #gameOver {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      padding: 30px;
      background: #111;
      color: white;
      text-align: center;
      border: 3px solid red;
      border-radius: 15px;
    }
    #gameOver h1 {
      color: red;
      margin: 0;
    }
    #gameOver button {
      padding: 10px 20px;
      background: red;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
  <body>
    <button id="startButton">START GAME</button>
    <div id="gameOver">
      <h1>GAME OVER</h1>
      <p id="finalScore">Score: 0</p>
    </div>
    <a-scene physics="gravity: -9.8">
      <a-sky
        material="src: #sky"
        animation="property: rotation; 
        to: 0 360 0; loop: true; 
        dur: 5020000; easing: linear"
      ></a-sky>
      <a-assets>
        <img id="grass" src="../assets/images/grass.png" />
        <img id="sky" src="../assets/images/Sky.jpg" />
      </a-assets>
      <!--start-->
      <a-entity
        position="0 6 -15"
        animation="property: position; to: 0 7 -15; dir: alternate; dur: 1500; loop: true"
      >
        <a-torus
          radius="2"
          radius-tubular="0.08"
          color="cyan"
          material="emissive: #00ffff; emissiveIntensity: 2"
          animation="property: rotation; to: 360 360 0; dur: 5000; loop: true; easing: linear"
        ></a-torus>
        <a-text
          value="READY?"
          align="center"
          color="#00ffff"
          width="6"
          position="0 0 0"
        ></a-text>
      </a-entity>
      <a-sphere
        position="-7 6 -15"
        radius="0.4"
        color="cyan"
        material="emissive: #00ffff; emissiveIntensity: 2"
        animation="property: position; to: -7 7 -15; dir: alternate; dur: 1800; loop: true"
      ></a-sphere>
      <a-sphere
        position="7 7 -15"
        radius="0.4"
        color="magenta"
        material="emissive: #ff00ff; emissiveIntensity: 2"
        animation="property: position; to: 7 6 -15; dir: alternate; dur: 1800; loop: true"
      ></a-sphere>
      <a-sphere
        position="-7 6 -15"
        radius="0.4"
        color="cyan"
        material="emissive: cyan; emissiveIntensity: 2"
        animation="property: position; to: -7 7 -15; dir: alternate; dur: 1800; loop: true"
      >
      </a-sphere>
      <a-torus
        position="-9 8 -20"
        radius="1"
        radius-tubular="0.05"
        color="yellow"
        animation="property: rotation; to: 360 360 0; dur: 4000; loop: true"
      >
      </a-torus>
      <a-sphere
        position="-5 9 -25"
        radius="0.25"
        color="white"
        material="emissive: white; emissiveIntensity: 3"
        animation="property: position; to: -5 8 -25; dir: alternate; dur: 1200; loop: true"
      >
      </a-sphere>
      <a-sphere
        position="7 7 -15"
        radius="0.4"
        color="magenta"
        material="emissive: magenta; emissiveIntensity: 2"
        animation="property: position; to: 7 6 -15; dir: alternate; dur: 1800; loop: true"
      >
      </a-sphere>
      <a-torus
        position="9 8 -20"
        radius="1"
        radius-tubular="0.05"
        color="yellow"
        animation="property: rotation; to: -360 -360 0; dur: 4000; loop: true"
      >
      </a-torus>
      <a-sphere
        position="5 9 -25"
        radius="0.25"
        color="white"
        material="emissive: white; emissiveIntensity: 3"
        animation="property: position; to: 5 8 -25; dir: alternate; dur: 1200; loop: true"
      >
      </a-sphere>
      <!--end-->
      <a-plane
        id="infinite-grass"
        position="0 -3 -60"
        rotation="-90 0 0"
        width="300"
        height="300"
        material="src: #grass; repeat: 50 50;"
      ></a-plane>
      <!-- ENDLESS ROAD -->
      <a-box
        class="road"
        position="0 0.1 5"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -15"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -35"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -55"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -75"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -95"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -115"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <a-box
        class="road"
        position="0 0.1 -135"
        width="10"
        height="0.2"
        depth="20"
        color="dimgray"
        static-body
      ></a-box>
      <!-- ROAD CENTER LINES -->
      <a-box
        class="road-line"
        position="0 0.22 5"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -15"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -35"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -55"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -75"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -95"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -115"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <a-box
        class="road-line"
        position="0 0.22 -135"
        width="0.3"
        height="0.05"
        depth="5"
        color="white"
      ></a-box>
      <!-- BALL -->
      <a-sphere
        id="ball"
        position="0 1 5"
        radius="0.5"
        color="red"
        dynamic-body>
        <a-box
          position="0 -0.5 0"
          width="1.5"
          height="0.5"
          depth="2"
          color="blue"
        ></a-box>
        <a-box
          position="0 -0.2 0"
          width="1"
          height="0.4"
          depth="1"
          color="cyan"
        ></a-box>
        <a-cylinder
          position="-0.7 -0.7 0.6"
          radius="0.3"
          height="0.2"
          rotation="0 0 90"
          color="black"
        ></a-cylinder>
        <a-cylinder
          position="0.7 -0.7 0.6"
          radius="0.3"
          height="0.2"
          rotation="0 0 90"
          color="black"
        ></a-cylinder>
      </a-sphere>
      <!-- OBSTACLES -->
      <a-box
        class="obstacle"
        position="-3 0.7 -20"
        width="1"
        height="1.4"
        depth="1"
        color="orange"
        static-body
      ></a-box>
      <a-box
        class="obstacle"
        position="3 0.7 -40"
        width="1"
        height="1.4"
        depth="1"
        color="red"
        static-body
      ></a-box>
      <a-box
        class="obstacle"
        position="0 0.7 -60"
        width="1"
        height="1.4"
        depth="1"
        color="yellow"
        static-body
      ></a-box>
      <a-box
        class="obstacle"
        position="-3 0.7 -80"
        width="1"
        height="1.4"
        depth="1"
        color="blue"
        static-body
      ></a-box>
      <a-entity position="0 5 12" rotation="-15 0 0">
        <a-camera></a-camera>
      </a-entity>
      <a-text
        id="score"
        value="Score: 0"
        position="-1 10 -11"
        color="cyan"
        width="18"
      ></a-text>
    </a-scene>
    <script>
      // GET ELEMENTS
      let gameStarted = false;

      const startButton = document.querySelector("#startButton");
      const ball = document.querySelector("#ball");
      const roads = document.querySelectorAll(".road");
      const roadLines = document.querySelectorAll(".road-line");
      const obstacles = document.querySelectorAll(".obstacle");
      const infiniteGrass = document.querySelector("#infinite-grass");
      // SETTINGS
      const sideSpeed = 20;
      const roadSpeed = 0.55;
      const recycleDistance = 160;
      // ROLL DIRECTION
      // -1 = left
      //  0 = stopped
      //  1 = right
      let rollDirection = 0;
      // Track arrow keys
      const keys = {
        ArrowLeft: false,
        ArrowRight: false,
      };
      // BALL LEFT / RIGHT CONTROL
      document.addEventListener("keydown", function (event) {
        if (!ball.body) return;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          keys[event.key] = true;
          updateBallMovement();
        }
      });
      // STOP LEFT / RIGHT
      document.addEventListener("keyup", function (event) {
        if (!ball.body) return;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          keys[event.key] = false;
          updateBallMovement();
        }
      });
      // UPDATE BALL MOVEMENT
      function updateBallMovement() {
        if (!ball.body) return;
        if (keys.ArrowLeft && !keys.ArrowRight) {
          ball.body.velocity.x = -sideSpeed;
          rollDirection = -1;
        } else if (keys.ArrowRight && !keys.ArrowLeft) {
          ball.body.velocity.x = sideSpeed;
          rollDirection = 1;
        } else {
          ball.body.velocity.x = 0;
          rollDirection = 0;
        }
      }
      // KEEP BALL FROM MOVING FORWARD
      function keepBallInPlace() {
        if (!ball.body) return;
        ball.body.velocity.z = 0;
      }
      // ENDLESS ROAD
      function moveRoad() {
        roads.forEach(function (road) {
          // Move road toward player
          road.object3D.position.z += roadSpeed;
          // Recycle road
          if (road.object3D.position.z > 17) {
            road.object3D.position.z -= recycleDistance;
          }
        });
        // MOVE ROAD LINES
        roadLines.forEach(function (line) {
          line.object3D.position.z += roadSpeed;
          // Recycle line
          if (line.object3D.position.z > 15) {
            line.object3D.position.z -= recycleDistance;
          }
        });
        // MOVE OBSTACLES
        obstacles.forEach(function (obstacle) {
          obstacle.object3D.position.z += roadSpeed;

          // Recycle obstacle
          if (obstacle.object3D.position.z > 17) {
            obstacle.object3D.position.z -= recycleDistance;
          }
        });
        requestAnimationFrame(moveRoad);
      }
      // BALL ROLLING ANIMATION
      function rollBall() {
        // Normal forward rolling
        ball.object3D.rotation.x += 0.08;
        // Left / right visual rolling
        ball.object3D.rotation.z -= rollDirection * 0.12;
        requestAnimationFrame(rollBall);
      }
      // MOVE GRASS TEXTURE
      function moveGrass() {
        const mesh = infiniteGrass.getObject3D("mesh");
        if (mesh && mesh.material && mesh.material.map) {
          const texture = mesh.material.map;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.offset.y += 0.01;
          texture.needsUpdate = true;
        }
        requestAnimationFrame(moveGrass);
      }
      // SCORE
      let score = 0;
      const scoreText = document.querySelector("#score");
      // OBSTACLE COLLISION
      ball.addEventListener("collide", function (event) {
        const hitObject = event.detail.body.el;
        if (!hitObject || !hitObject.classList.contains("obstacle")) {
          return;
        }
        // Prevent the same obstacle from scoring twice
        if (hitObject.dataset.hit === "true") {
          return;
        }
        hitObject.dataset.hit = "true";
        // Add point
        score++;
        scoreText.setAttribute("value", "Score: " + score);
        // Hide obstacle
        hitObject.setAttribute("visible", false);
        // Move it far ahead for respawn
        hitObject.object3D.position.z -= recycleDistance;
        // Show it again after a short delay
        setTimeout(function () {
          hitObject.setAttribute("visible", true);
          hitObject.dataset.hit = "false";
        }, 1000);
      });
      function checkGameOver() {
        if (!gameStarted) return;
        if (ball.object3D.position.y < -1) {
          gameStarted = false;
          document.querySelector("#gameOver").style.display = "block";
          document.querySelector("#finalScore").textContent = "Score: " + score;
        }
        requestAnimationFrame(checkGameOver);
      }
      // START GAME
      startButton.addEventListener("click", function () {
        gameStarted = true;
        startButton.style.display = "none";
        moveRoad();
        rollBall();
        moveGrass();
        checkGameOver();
        // Keep ball position stable
        setInterval(keepBallInPlace, 10);
      });
    </script>
  </body>
</html>
